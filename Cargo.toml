[workspace]
resolver = "2"
# Downward-only: {types, mem, testkit} <- {blob, format, rest} <- {reader, writer} <- coordinator <- node <- compat.
# reader and writer are siblings and never depend on each other.
# `scripts/check-layering.py` enforces this order.
members = [
    "crates/types",
    "crates/mem",
    "crates/testkit",
    "crates/blob",
    "crates/format",
    "crates/rest",
    "crates/reader",
    "crates/writer",
    "crates/coordinator",
    "crates/node",
    "crates/compat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
repository = "https://github.com/huyz0/opensearch-serverless"

[workspace.dependencies]
oss-types = { path = "crates/types" }
oss-mem = { path = "crates/mem" }
oss-testkit = { path = "crates/testkit" }
oss-blob = { path = "crates/blob" }
oss-format = { path = "crates/format" }
oss-rest = { path = "crates/rest" }
oss-reader = { path = "crates/reader" }
oss-writer = { path = "crates/writer" }
oss-coordinator = { path = "crates/coordinator" }

# Test-only.
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }

# lucene-rust, the engine, is the only external code dependency
# (docs/adr/0002-runtime-dependencies.md): git crates pinned at one exact
# `rev`. Bump all of them together. For local cross-repo work, uncomment the
# [patch] block at the end of this file.
lucene-store = { git = "https://github.com/huyz0/lucene-rust", rev = "3b4e3a3e6c1df64f9177d123a204b5f05fa16a21" }
lucene-index = { git = "https://github.com/huyz0/lucene-rust", rev = "3b4e3a3e6c1df64f9177d123a204b5f05fa16a21" }
lucene-search = { git = "https://github.com/huyz0/lucene-rust", rev = "3b4e3a3e6c1df64f9177d123a204b5f05fa16a21" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Lengths, counts and offsets read out of a blob, a manifest or a log record
# must never reach `+`/`-`/`*`/`<<` unbounded: a debug build panics, a release
# build wraps silently. Starting with an empty tree, the lint is on everywhere;
# every `#[allow]` of it carries an `// ARITH:` proof
# (`scripts/check-arith-allows.py`).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true

# Local lucene-rust checkout, for changes that span both repositories:
# [patch."https://github.com/huyz0/lucene-rust"]
# lucene-store = { path = "../lucene-rust/crates/lucene-store" }
# lucene-index = { path = "../lucene-rust/crates/lucene-index" }
# lucene-search = { path = "../lucene-rust/crates/lucene-search" }
