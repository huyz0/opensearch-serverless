[workspace]
resolver = "2"
# Downward-only: {types, mem, testkit} <- {blob, format, rest, transport} <- {meta, cluster} <- {reader, writer} <- coordinator <- node <- compat.
# reader and writer are siblings and never depend on each other.
# `scripts/check-layering.py` enforces this order.
members = [
    "crates/types",
    "crates/mem",
    "crates/testkit",
    "crates/blob",
    "crates/format",
    "crates/rest",
    "crates/edge",
    "crates/doc",
    "crates/reader",
    "crates/writer",
    "crates/janitor",
    "crates/meta",
    "crates/cluster",
    "crates/transport",
    "crates/coordinator",
    "crates/node",
    "crates/compat",
    "crates/chunkjson",
    "crates/ext",
    "crates/ext-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
repository = "https://github.com/huyz0/opensearch-serverless"

[workspace.dependencies]
# The restore's rename pattern (docs/specs/snapshot-restore): already in the tree through lucene-rust.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
oss-types = { path = "crates/types" }
oss-ext = { path = "crates/ext" }
oss-ext-wasm = { path = "crates/ext-wasm" }
oss-mem = { path = "crates/mem" }
oss-edge = { path = "crates/edge" }
oss-testkit = { path = "crates/testkit" }
oss-blob = { path = "crates/blob" }
oss-format = { path = "crates/format" }
oss-meta = { path = "crates/meta" }
oss-cluster = { path = "crates/cluster" }
oss-transport = { path = "crates/transport" }
oss-rest = { path = "crates/rest" }
oss-doc = { path = "crates/doc" }
chunkjson = { path = "crates/chunkjson" }
# A struct that owns a value and what borrows it, in safe code.
self_cell = "1"
# Password hashes of internal users, as the security plugin stores them (bcrypt, `$2b$`).
bcrypt = { version = "=0.17.1", default-features = false, features = ["std"] }
oss-reader = { path = "crates/reader" }
oss-writer = { path = "crates/writer" }
oss-janitor = { path = "crates/janitor" }
oss-coordinator = { path = "crates/coordinator" }

# Test-only.
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }

# lucene-rust, the engine, is the only sibling project used as code
# (docs/adr/0002-runtime-dependencies.md): git crates pinned at one exact
# `rev`. Bump all of them together. For local cross-repo work, uncomment the
# [patch] block at the end of this file.
lucene-store = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-index = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-search = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-codecs = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-analysis = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-util = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-aggs = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-highlighter = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
lucene-queryparser = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969" }
# The function-score node only: the analysis modules (heavy dictionaries) stay off.
lucene-engine = { git = "https://github.com/huyz0/lucene-rust", rev = "96a49ebdce4e6db6754c213c2645956223823969", default-features = false }

# Any crate may use `unsafe`, item by item, in the five patterns of
# docs/unsafe.md: each use takes a local `#[allow(unsafe_code)]`, a
# `// SAFETY:` comment per block, and `# Safety` docs on each `unsafe fn`
# (`scripts/check-unsafe.py` and the clippy lints below).
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

# Lengths, counts and offsets read out of a blob, a manifest or a log record
# must never reach `+`/`-`/`*`/`<<` unbounded: a debug build panics, a release
# build wraps silently. Starting with an empty tree, the lint is on everywhere;
# every `#[allow]` of it carries an `// ARITH:` proof
# (`scripts/check-arith-allows.py`).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
overflow-checks = true

# Local lucene-rust checkout, for changes that span both repositories:
# [patch."https://github.com/huyz0/lucene-rust"]
# lucene-store = { path = "../lucene-rust/crates/lucene-store" }
# lucene-index = { path = "../lucene-rust/crates/lucene-index" }
# lucene-search = { path = "../lucene-rust/crates/lucene-search" }
# lucene-codecs = { path = "../lucene-rust/crates/lucene-codecs" }
# lucene-analysis = { path = "../lucene-rust/crates/lucene-analysis" }
