# cargo-nextest configuration (https://nexte.st/docs/configuration/).
#
# Every test is its own process, scheduled across all cores, and a test that
# hangs is killed instead of holding the runner until the job's timeout.

[profile.default]
# Most of the slow tests wait (a timer, a lease TTL, an idle window) and use
# little CPU, so as many as cores leave the cores idle. Measured on oss-node
# (1,550 tests, 4 cores): 158 s at 4 threads, 80 s at 8, 58 s at 16, the same
# 96 s of CPU each time. The cap on each test's memory (memcap-runner.sh)
# still bounds a runaway test.
test-threads = 16
# Reported SLOW after 60 s; killed and failed after 10 periods (10 minutes).
slow-timeout = { period = "60s", terminate-after = 10 }

# The QUIC tests each run a handshake and measure latency or memory, which
# 16 at once on 4 cores can push past a connect timeout (h3_idle, CI run
# 45981273305, 16 threads). They run two at a time.
[test-groups.quic]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(oss-edge) and binary(/^h3/)'
test-group = 'quic'

# These two time things against each other (the p99 of a write in one setting
# against another; how long a probe call takes, then a call sized from it), so
# other tests' load between the two measurements fails them (CI run
# 45986577000). Each runs with the whole test pool to itself.
[[profile.default.overrides]]
filter = 'package(oss-node) and (binary(commit_cost) or binary(extension_item_cap))'
threads-required = 'num-test-threads'

# The h3 memory test reads a process-wide heap peak while four uploads
# stream; other tests' load changes how much of the upload sits in flight at
# once (4 x 64 MiB read 3.1 MB against 1.5 MB for 4 x 16 MiB in main run
# 3277). It runs with the whole test pool to itself too. So does the idle
# connection test, which opens a burst of handshakes and timed out on its
# 30 s connect when another h3 binary shared the runner (main run 3410).
[[profile.default.overrides]]
filter = 'package(oss-edge) and (binary(h3_memory) or binary(h3_idle))'
threads-required = 'num-test-threads'

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
# The whole list of failures is worth more than minutes saved by stopping early.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
