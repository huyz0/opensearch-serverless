# cargo-nextest configuration (https://nexte.st/docs/configuration/).
#
# Every test is its own process, scheduled across all cores, and a test that
# hangs is killed instead of holding the runner until the job's timeout.

[profile.default]
# Reported SLOW after 60 s; killed and failed after 10 periods (10 minutes).
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
# The whole list of failures is worth more than minutes saved by stopping early.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
