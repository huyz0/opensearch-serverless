[package]
name = "oss-format"
description = "opensearch-serverless: the Java shell's blob formats: segment blobs, node packs, commit descriptors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
oss-types = { workspace = true }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = "=0.11.1"
zstd-safe = { version = "=7.4.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
oss-testkit = { workspace = true }

# Its own binary: the counting allocator is process-wide.
[[test]]
name = "skip_copies_nothing"

[[test]]
name = "node_log_alloc"
