[package]
name = "oss-node"
description = "opensearch-serverless: the node binary, with each role behind a build switch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Each role is a build switch. The reader is the first role built
# (docs/roadmap.md), so it is the only one on by default.
default = ["reader"]
# The protocol front: HTTP/2 over clear text and TLS, bridged to the HTTP/1.1 server (docs/adr/0058). Off by default; with it
# off, an OSS_EDGE_* listener is refused at start rather than ignored.
edge = ["dep:oss-edge", "dep:oss-rest", "dep:oss-mem"]
reader = [
    "dep:oss-reader",
    "dep:oss-query",
    "dep:oss-rest",
    "dep:oss-blob",
    "dep:lucene-store",
    "dep:lucene-analysis",
    "dep:lucene-search",
    "dep:oss-mem",
    "dep:oss-transport",
    "dep:oss-format",
    "dep:oss-meta",
    "dep:oss-doc",
    "dep:bcrypt",
    "dep:ring",
    "dep:serde_json",
]
writer = [
    "dep:oss-writer",
    "dep:oss-blob",
    "dep:oss-transport",
    "dep:oss-cluster",
    "dep:oss-format",
    "dep:lucene-store",
    "dep:lucene-index",
    "dep:self_cell",
    "dep:oss-rest",
    "dep:oss-meta",
    "dep:oss-janitor",
    "dep:oss-mem",
    "dep:oss-coordinator",
    "dep:oss-doc",
    "dep:bcrypt",
    "dep:ring",
    "dep:ureq",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:oss-ml",
]
# The extension module runtime and its upload route (docs/adr/0052). Off by default; with it
# on, a node still serves nothing until OSS_EXTENSIONS_PERCENT gives it a pool.
extensions = ["reader", "writer", "dep:oss-ext-wasm", "dep:sha2"]
coordinator = ["dep:oss-coordinator", "dep:oss-cluster", "dep:oss-blob", "dep:oss-transport", "dep:oss-doc", "dep:bcrypt", "dep:ring"]

[dependencies]
oss-types = { workspace = true }
oss-anomaly = { workspace = true }
oss-reader = { workspace = true, optional = true }
oss-writer = { workspace = true, optional = true }
oss-ml = { workspace = true, optional = true }
oss-coordinator = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
oss-doc = { workspace = true, optional = true }
# A forwarded search's query as the JSON the reader parses.
serde_json = { version = "=1.0.145", optional = true }
oss-ext = { workspace = true }
oss-ext-wasm = { workspace = true, optional = true }
sha2 = { version = "=0.11.1", optional = true }
oss-rest = { workspace = true, optional = true }
oss-query = { workspace = true, optional = true }
oss-edge = { workspace = true, optional = true }
oss-transport = { workspace = true, optional = true }
oss-cluster = { workspace = true, optional = true }
oss-meta = { workspace = true, optional = true }
oss-janitor = { workspace = true, optional = true }
oss-format = { workspace = true, optional = true }
oss-blob = { workspace = true, optional = true }
lucene-store = { workspace = true, optional = true }
lucene-analysis = { workspace = true, optional = true }
lucene-index = { workspace = true, optional = true }
lucene-search = { workspace = true, optional = true }
self_cell = { workspace = true, optional = true }
oss-mem = { workspace = true, optional = true }
# The plugin proxy's client (docs/adr/0043): plain HTTP(S) to Java nodes.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"], optional = true }
# The SMTP client of the notifications plugin (docs/adr/0081): TLS to a relay the operator declared.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
webpki-roots = { version = "1", optional = true }

# The binary retires the node on SIGTERM and SIGINT (docs/adr/0048); a safe
# iterator over the signals, no `unsafe` here.
[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"

[dev-dependencies]
# The gRPC differential tests: a client of the front and the protobuf schema it serves.
oss-edge = { workspace = true }
h2 = "0.4"
http = "1"
bytes = "1"
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time"] }
# The HTTP/3 test: a QUIC client of the front and a throwaway certificate for it.
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# The extension upload tests build their modules from text.
wat = "1"
serde_json = "=1.0.145"
# The suite creates a RustFS bucket with one signed request.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
lucene-store = { workspace = true }
lucene-codecs = { workspace = true }
oss-blob = { workspace = true, features = ["emulator"] }
oss-mem = { workspace = true }
oss-testkit = { workspace = true, features = ["index"] }
# The publish-then-read test: what the writer publishes, the reader opens.
oss-writer = { workspace = true }
oss-reader = { workspace = true }
oss-format = { workspace = true }
lucene-index = { workspace = true }
lucene-search = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "handlers"
required-features = ["writer"]

[[test]]
name = "pit_route"
required-features = ["writer"]

[[test]]
name = "plugin_proxy"
required-features = ["writer"]

[[test]]
name = "pit_route_limits"
required-features = ["writer"]

[[test]]
name = "cat_routes"
required-features = ["writer"]

[[test]]
name = "health_store"
required-features = ["writer"]

[[test]]
name = "cluster_suite"
required-features = ["reader", "writer", "coordinator"]

[[test]]
name = "dead_logs"
required-features = ["writer"]

[[test]]
name = "dead_log_pass"
required-features = ["writer"]

[[test]]
name = "virtual_soak"
required-features = ["writer"]

[[test]]
name = "scripted_metric_shards"
required-features = ["coordinator"]
