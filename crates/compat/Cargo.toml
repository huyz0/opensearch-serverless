[package]
name = "oss-compat"
description = "opensearch-serverless: the OpenSearch compatibility suite: fixtures, normaliser, runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The fixture format is JSON. Exact pin: the compatibility suite is a test
# harness, never part of a shipped node build.
serde_json = "=1.0.145"

[lints]
workspace = true

[dev-dependencies]
# The node under test, reader role, serving the compat indexes from the
# in-process emulator.
oss-node = { path = "../node", features = ["reader"] }
oss-blob = { workspace = true, features = ["emulator"] }
oss-mem = { workspace = true }
oss-rest = { workspace = true }
