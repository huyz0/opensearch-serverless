[package]
name = "oss-reader"
description = "opensearch-serverless: reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
oss-types = { workspace = true }
oss-blob = { workspace = true }
oss-format = { workspace = true }
oss-cluster = { workspace = true }
oss-doc = { workspace = true }
oss-ext = { workspace = true }
oss-rest = { workspace = true }
lucene-store = { workspace = true }
lucene-index = { workspace = true }
lucene-search = { workspace = true }
lucene-analysis = { workspace = true }
lucene-codecs = { workspace = true }
lucene-util = { workspace = true }
lucene-aggs = { workspace = true }
lucene-highlighter = { workspace = true }
lucene-queryparser = { workspace = true }
lucene-engine = { workspace = true }

[dev-dependencies]
oss-blob = { workspace = true, features = ["emulator"] }
oss-mem = { workspace = true }
oss-testkit = { workspace = true, features = ["index"] }
# Test-only: creates the bucket of a RustFS the request-count measurement runs against.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
