# The expensive checks, once a night on main, so pull requests stay fast.
# A red job opens (or comments on) an issue titled "nightly: <job>".
# See docs/ci.md.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LUCENE_RUST_DATA_CACHE: /home/runner/.cache/lucene-rust-data
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  nightly:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: [coverage, slow-tests, clippy-aarch64, fuzz]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job }}
      # lucene-rust's build script downloads its data jars (hash-pinned) from
      # Maven Central, which answers 429 to a busy runner pool: keep them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lucene-rust-data
          key: lucene-rust-data-${{ hashFiles('Cargo.lock') }}
          restore-keys: lucene-rust-data-
      - uses: taiki-e/install-action@v2
        if: matrix.job == 'coverage' || matrix.job == 'mutants' || matrix.job == 'fuzz'
        with:
          tool: ${{ matrix.job == 'coverage' && 'cargo-llvm-cov' || matrix.job == 'mutants' && 'cargo-mutants' || 'cargo-fuzz' }}
      - name: run
        env:
          JOB: ${{ matrix.job }}
        run: |
          case "$JOB" in
            coverage)       scripts/coverage.sh --locked --fail-under-lines 95 ;;
            slow-tests)     cargo test --locked --workspace --all-features -- --ignored ;;
            # The prebuilt cargo-fuzz defaults to its own musl target, which
            # cannot link a sanitizer: name the gnu target.
            fuzz)           rustup toolchain install nightly-2026-11-13 --profile minimal &&
                            cd crates/chunkjson/fuzz &&
                            for t in oracle feed; do
                              cargo +nightly-2026-11-13 fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=600 || exit 1
                            done ;;
            # ring's and zstd's build scripts need an aarch64 C compiler, its libc
            # headers, and a linker.
            clippy-aarch64) sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross &&
                            rustup target add aarch64-unknown-linux-gnu &&
                            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
                            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
                            cargo clippy --locked --workspace --all-targets --all-features --target aarch64-unknown-linux-gnu -- -D warnings ;;
          esac
      - name: keep the fuzz reproducer
        if: failure() && matrix.job == 'fuzz'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/chunkjson/fuzz/artifacts
          if-no-files-found: ignore
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ matrix.job }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="nightly: $JOB"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $URL"
          else gh issue create --title "$title" --body "The nightly $JOB job failed: $URL"; fi

  # The workspace has about 12,900 mutants, far more than one job's hour: a
  # single sweep was cancelled at the limit three nights in four. Each night
  # four runners each take one of 28 slices, rotating by day of the year, so
  # every mutant is tested once every seven nights. A slice that runs out of
  # time still fails on a missed mutant it already found.
  mutants:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [0, 1, 2, 3]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      # lucene-rust's build script downloads its data jars (hash-pinned) from
      # Maven Central, which answers 429 to a busy runner pool: keep them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lucene-rust-data
          key: lucene-rust-data-${{ hashFiles('Cargo.lock') }}
          restore-keys: lucene-rust-data-
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: run
        env:
          LANE: ${{ matrix.lane }}
        run: |
          slice=$(( (10#$(date -u +%j) * 4 + LANE) % 28 ))
          echo "mutants: slice $slice/28"
          set +e
          MUTANTS_IN_PLACE=1 MUTANTS_BASELINE=run timeout 120m scripts/mutants.sh --all --shard "$slice/28" 2>&1 | tee "$RUNNER_TEMP/mutants.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ]; then
            if grep -q 'MISSED' "$RUNNER_TEMP/mutants.log"; then exit 1; fi
            echo "::warning::mutants: slice $slice ran out of time with no miss so far"
            exit 0
          fi
          exit "$rc"
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="nightly: mutants"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $URL"
          else gh issue create --title "$title" --body "A nightly mutants shard failed: $URL"; fi
