# One job per pull-request push, the only required check (`ci`). The local
# gate (scripts/gate.sh, run by the pre-push hook) is the real CI; this
# confirms it within the free runner budget. See docs/ci.md.
#
# Inside the job, steps skip by what changed (scripts/ci-changes.py):
# docs and scripts run only the tree checks; Rust changes build and test the
# changed crates and their dependents; Cargo.lock, the toolchain, the root
# manifest or CI files run everything. Coverage, the full mutation sweep and
# arm64 run nightly (nightly.yml), not here.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR replaces the run in flight; main runs never
# cancel each other. Description and label edits run in a group of their own,
# so editing a PR never cancels the run that checks its code.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'text' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  ci:
    # Drafts cost nothing until they are marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed.txt"
            git diff --name-only --diff-filter=A "$BASE...$HEAD" > "$RUNNER_TEMP/added.txt"
          else
            echo Cargo.lock > "$RUNNER_TEMP/changed.txt"; : > "$RUNNER_TEMP/added.txt"
          fi
          python3 scripts/ci-changes.py "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          # A description or label edit changes no code: check the PR text only.
          case "$ACTION" in edited|labeled|unlabeled) echo "text_only=true" >> "$GITHUB_OUTPUT";; *) echo "text_only=false" >> "$GITHUB_OUTPUT";; esac

      - name: pull request description and risk
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The event's body is the one at push time; read the current one, so a
          # description fixed after the push is what this run checks.
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md" 2>/dev/null \
            || printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          out=$(python3 scripts/check-pr.py --body "$RUNNER_TEMP/body.md" --labels "$LABELS" \
                --changed "$RUNNER_TEMP/changed.txt" --added "$RUNNER_TEMP/added.txt") && rc=0 || rc=$?
          printf '%s\n' "$out"
          # High-risk PRs get needs-huy: a flag for the owner's review after merge.
          if printf '%s\n' "$out" | grep -q '^high-risk' && ! printf '%s' "$LABELS" | grep -q needs-huy; then
            gh label create needs-huy --color B60205 --description "High-risk: owner reviews after merge" 2>/dev/null || true
            gh pr edit "$PR" --add-label needs-huy
          fi
          exit $rc

      - name: commit messages
        if: github.event_name == 'pull_request' && steps.changes.outputs.text_only == 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg.txt"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg.txt" || { echo "commit $c"; exit 1; }
          done

      - name: tree checks (no build)
        if: steps.changes.outputs.text_only == 'false'
        run: scripts/tree-checks.sh

      - name: toolchain
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        run: rustup show

      # Only main writes the cache, so PR branches cannot fill the 10 GB.
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fmt, clippy, docs
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          python3 scripts/gen-crate-map.py --check
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps --document-private-items

      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        with:
          tool: cargo-nextest

      - name: tests (affected crates)
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        env:
          FULL: ${{ steps.changes.outputs.full }}
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: |
          if [ "$FULL" = "true" ]; then sel="--workspace"; else sel="$PACKAGES"; fi
          # nextest runs every test binary at once across the cores; plain
          # `cargo test` runs them one after another. Doctests are not run by
          # nextest, so they keep `cargo test --doc`.
          # shellcheck disable=SC2086
          cargo nextest run --profile ci --locked --all-features $sel
          # shellcheck disable=SC2086
          cargo test --locked --all-features --doc $sel

      - name: mutants (changed lines)
        if: github.event_name == 'pull_request' && steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - if: github.event_name == 'pull_request' && steps.changes.outputs.rust == 'true' && steps.changes.outputs.text_only == 'false'
        # In place, on the tree the tests step just built: the runner is
        # thrown away, and a copy of the tree would rebuild every dependency.
        env:
          MUTANTS_IN_PLACE: "1"
        run: MUTANTS_BASE=origin/${{ github.base_ref }} scripts/mutants.sh --pr
