# cargo-mutants configuration (https://mutants.rs/).
#
# Mutants listed here are equivalent: no test can tell them apart from the
# original, so they would only ever be reported as missed. Each names why.
exclude_re = [
    # The JSON tokenizer refuses input that ends inside a value before it
    # yields `Eof`, so skipping a value never meets one; the arm only keeps
    # the loop from running forever if it did.
    "crates/writer/src/document/reader.rs:.*delete match arm Tok::Eof in Reader<'a>::skip_children",
    # Base64 packs three bytes into disjoint bits of one number, where `|`
    # and `^` give the same number.
    "crates/blob/src/s3/delete.rs:.*replace \\| with \\^ in base64",
    # A writer whose window another drives waits on the window's latch
    # without the lock; one that gives up at once takes the lock and waits
    # for the same window in the committer's own loop instead, and is told
    # the same result.
    "crates/writer/src/log/window.rs:.*replace Latch::wait -> .* with None",
    # The transport wire packs fields into disjoint bits (a status byte's
    # flags, a varint's continuation bit over seven value bits, a char's
    # UTF-8-style lead and continuation bits, a version id below the mask
    # bit), where `|` and `^` give the same byte.
    "crates/transport/src/frame/header.rs:.*replace \\| with \\^ in Status::",
    "crates/transport/src/stream/output.rs:.*replace \\| with \\^ in Output<'a>::(varint|string)",
    "crates/transport/src/stream/input.rs:.*replace \\| with \\^ in Input<'a>::string",
    "crates/transport/src/version.rs:.*replace \\^ with \\| in WireVersion::wire_id",
    # The inflate chunk's size only sets how often the loop turns.
    "crates/transport/src/frame/compress.rs:.*replace \\* with \\+",
    # As the inflate chunk: the discard buffer's size only sets how often
    # the loop turns.
    "crates/transport/src/channel.rs:.*replace \\* with \\+",
    # A hex pair joins a high nibble shifted past a low one: disjoint bits.
    "crates/transport/src/auth.rs:.*replace \\| with \\^ in unhex",
    # `Instant` deltas against the probe interval: `<` and `<=` differ for
    # one nanosecond, which no test can land on.
    "crates/transport/src/auth.rs:.*replace < with <= in Authenticator::begin_probe",
    # A read interrupted by a signal is retried; no test can deliver EINTR to
    # a blocking read on demand.
    "crates/transport/src/channel.rs:.*replace match guard e.kind\\(\\) == io::ErrorKind::Interrupted with false in read_or_eof",
    # A channel's idle timeout is set after its first frame; setting the
    # same timeout again after every frame changes nothing observable.
    "crates/transport/src/server/mod.rs:.*delete ! in serve_channel",
    # `Instant::now() < deadline` against `<=`: they differ for one instant of
    # a clock with nanosecond resolution.
    "crates/rest/src/conn.rs:.*replace < with <= in linger",
    # The filesystem store syncs each directory a write created; stopping
    # early only loses durability on power failure, which no test can cause.
    "crates/blob/src/fs/mod.rs:.*replace == with != in create_dirs",
    # A LIST walk's pruning only saves work: a key or directory it lets
    # through is still capped by the page's heap, so the page is the same.
    # Keys are unique, so `<` against the largest kept key equals `<=`; a
    # directory key is at least as long as any key under it, so `>` and `>=`
    # against MAX_KEY_BYTES, or against a cursor it is no prefix of, agree.
    "crates/blob/src/fs/list.rs:.*replace Smallest<'_>::full -> bool with false",
    "crates/blob/src/fs/list.rs:.*replace < with <= in Smallest<'_>::admits",
    "crates/blob/src/fs/list.rs:.*replace > with >= in Smallest<'_>::admits_dir",
    # A register decoder with all 8 generation bytes seen copies none more:
    # `seen <= 8` only adds a split of zero bytes.
    "crates/blob/src/register/mod.rs:.*replace < with <= in Decoder<'a>::feed",
    # A register file that cannot be opened for a reason other than absence
    # (permissions) cannot be made in a test run as root.
    "crates/blob/src/fs/register.rs:.*replace match guard is_missing\\(&e\\) with true in open",
    # The register lock's explicit drop closes the file before the mutex,
    # which the fields' declaration order already does; it guards a reorder.
    "crates/blob/src/fs/lock.rs:.*replace <impl Drop for Held>::drop with \\(\\)",
    # A membership probe's `elapsed() < interval` against `<=`: they differ
    # for one instant of a nanosecond clock, as in linger above.
    "crates/cluster/src/lease/refresh.rs:.*replace < with <= in Membership::refresh_if_older_than",
    # A digest copy with the same expiry as the one held is the same renewal
    # (a renewal always moves the expiry), so taking it changes nothing.
    "crates/cluster/src/lease/refresh.rs:.*replace > with >= in Membership::merge_digest",
    # Murmur3's tail mixes the partial block when bytes are left; with none
    # left the block is 0, and mixing 0 gives 0, so `>=` changes nothing.
    "crates/cluster/src/placement/hash.rs:.*replace > with >= in Murmur3::finish",
    # Of two random picks with equal searches running, which is chosen is
    # itself random: `<=` only swaps which random pick wins a tie.
    "crates/cluster/src/placement/spread.rs:.*replace < with <= in HotShardSpread::pick",
    # A rate decayed at the instant it was last touched decays by e^0 = 1.
    "crates/cluster/src/placement/spread.rs:.*replace > with >= in Rate::decay",
    # `mean > 0.0` against `>=`: a mean of 0 means this node holds nothing (or less, when it reports
    # none), so `held > mean * 1.5` or `held >= cap / 4` already fails.
    "crates/cluster/src/placement/fleet.rs:161:21: replace > with >= in FleetView<'a>::above_fleet_share",
    # A held count below 0 (not reported) is room only where the cap is
    # positive, and there any held below 0, or of 0, is below the cap: the
    # Java's `held < 0` check, ported as it is, decides nothing alone.
    "crates/cluster/src/placement/fleet.rs:206:62: replace < with (==|<=) in FleetView<'a>::writer_for",
    "crates/cluster/src/placement/fleet.rs:285:23: replace < with (==|<=) in FleetView<'a>::has_takeover_room",
    # writeUTF's lead and continuation bytes join a fixed prefix with value
    # bits below it: disjoint bits, where `|` and `^` give the same byte.
    "crates/format/src/mutf8.rs:.*replace \\| with \\^ in write",
    # The node log's I/O buffer size: a GET or PUT streams through any
    # non-empty buffer to the same bytes; only the chunk count differs.
    "crates/writer/src/log/store.rs:21:43: replace \\* with \\+",
    # Only an infinite value reaches the sign test, and it is never 0.
    "crates/writer/src/mapping/json.rs:.*replace > with >= in java_floating",
    # The quote analyzer follows the search analyzer, which follows the
    # analyzer: with `standard` the only analyzer taken, all three are equal.
    "crates/writer/src/mapping/types.rs:.*replace \\+ with \\*$",
    # simple_query_string's grammar reads the query text through `at`,
    # which returns 0 past the end, and an index that stays on a closing
    # `)` is advanced by the `)` arm of the same loop, so these
    # mutants give the same query: `>` to `>=` and `+` to `-` or `*` in
    # the check for a `~` after a phrase's closing quote, `+=` to `*=` for
    # the step past an empty or finished group, `<` to `<=` at the end of a
    # fuzziness's digits, and the phrase or boolean analysis choice of a
    # text that has no terms either way.
    "simple_string_build.rs:\\d+:37: replace > with >= in Run<'_, '_>::consume_phrase",
    "simple_string_build.rs:\\d+:51: replace \\+ with .* in Run<'_, '_>::consume_phrase",
    "simple_string_build.rs:\\d+:25: replace \\+= with \\*= in Run<'_, '_>::consume_sub_query",
    "simple_string_build.rs:\\d+:27: replace < with <= in Run<'_, '_>::parse_fuzziness",
    # An empty token builds no query either way: the analyzer gives it no terms.
    "simple_string_build.rs:\\d+:19: replace > with >= in Run<'_, '_>::consume_token",
    "simple_string_leaf.rs:\\d+:46: replace == with != in Run<'_, '_>::matched",
    # The grammar's loop guard only fires when a loop stops moving, which
    # no input makes it do; it exists so a broken loop fails a query where
    # it would hang the node.
    "simple_string_build.rs:\\d+:\\d+: replace .* in Run<'_, '_>::tick",
]
